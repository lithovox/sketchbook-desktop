[package]
name = "sketchbook"
version = "0.1.0" # the app's version is ../sketchbook/package.json's (tauri.conf.json)
description = "LithoVox Sketchbook desktop app"
authors = ["LithoVox"]
license = ""
repository = ""
edition = "2024"
rust-version = "1.90"

[lib]
name = "sketchbook_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.1", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.1", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-log = "2"
tauri-plugin-opener = "2"
